name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    # Fork code needs maintainer review and an owned branch before shared-runner execution.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, 1msg-ci-heavy]
    timeout-minutes: 45
    # Native packages are installed only inside this disposable job container.
    container:
      image: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare the isolated native toolchain environment
        run: |
          echo "CI_WORKSPACE_OWNER=$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")" >> "$GITHUB_ENV"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git gzip lsb-release sudo tar unzip xz-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.18.0"
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          run_install: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
      - run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true
      - run: pnpm --dir tools/quality --ignore-workspace install --lockfile-dir "$PWD/quality/tooling" --frozen-lockfile --ignore-scripts --config.engine-strict=false
      - run: pnpm run test:quality
      - run: node tools/quality/run.mjs guards
      - run: pnpm run format:check
      - run: pnpm run lint:static
      - run: pnpm run lint:unused:production
      - run: pnpm run lint:unused:full
      - run: pnpm run lint:duplicates
      - run: pnpm run lint:duplicates:full
      - run: node quality/generator/generate.mjs
      - run: node quality/generator/verify-negative.mjs
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libcpprest-dev libboost-all-dev cmake ninja-build
      - run: cmake -S quality -B .quality-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
      - run: cmake --build .quality-build --parallel 2
      - run: ctest --test-dir .quality-build --output-on-failure
      - run: cmake --install .quality-build/sdk --prefix "${{ runner.temp }}/sdk-install-${{ github.run_id }}-${{ github.run_attempt }}"
      - run: cmake -S quality/consumer -B .quality-build/consumer -DCMAKE_PREFIX_PATH="${{ runner.temp }}/sdk-install-${{ github.run_id }}-${{ github.run_attempt }}"
      - run: cmake --build .quality-build/consumer --parallel 2
      - run: ctest --test-dir .quality-build/consumer --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            quality/generator/provenance.json
            quality/generator/inventory.json
            quality/reports/
      - name: Restore this checkout ownership for later jobs
        if: always()
        run: |
          if [ -n "${CI_WORKSPACE_OWNER:-}" ]; then
            chown -hR "$CI_WORKSPACE_OWNER" "$GITHUB_WORKSPACE"
          fi
  quality-required:
    if: always()
    needs: [contract]
    runs-on: [self-hosted, 1msg-ci]
    steps:
      - env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
        run: test "$CONTRACT_RESULT" = success
