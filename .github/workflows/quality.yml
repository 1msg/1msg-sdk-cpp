name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
      - run: npm ci
      - run: npm --prefix tools/quality ci
      - run: npm run test:quality
      - run: node tools/quality/run.mjs guards
      - run: npm run format:check
      - run: npm run lint:static
      - run: npm run lint:unused:production
      - run: npm run lint:unused:full
      - run: npm run lint:duplicates
      - run: npm run lint:duplicates:full
      - run: node quality/generator/generate.mjs
      - run: node quality/generator/verify-negative.mjs
      - run: sudo apt-get update && sudo apt-get install -y libcpprest-dev libboost-all-dev cmake ninja-build
      - run: cmake -S quality -B .quality-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
      - run: cmake --build .quality-build --parallel 2
      - run: ctest --test-dir .quality-build --output-on-failure
      - run: cmake --install .quality-build/sdk --prefix "${{ runner.temp }}/sdk-install"
      - run: cmake -S quality/consumer -B .quality-build/consumer -DCMAKE_PREFIX_PATH="${{ runner.temp }}/sdk-install"
      - run: cmake --build .quality-build/consumer --parallel 2
      - run: ctest --test-dir .quality-build/consumer --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            quality/generator/provenance.json
            quality/generator/inventory.json
            quality/reports/
  quality-required:
    if: always()
    needs: [contract]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS); if(!Object.values(jobs).every(job=>job.result==="success")) process.exit(1)'
